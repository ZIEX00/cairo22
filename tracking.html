<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تتبع الطلب | Cairo22</title>
  <style>
    :root {
      --bg: #f7f1e8;
      --panel: rgba(255,255,255,0.9);
      --panel-2: rgba(255,248,239,0.9);
      --text: #1d1712;
      --muted: #62564d;
      --gold: #f0b35d;
      --gold-strong: #b96d1a;
      --gold-dark: #7d4a12;
      --border: rgba(137,94,40,0.18);
      --success: #2e7d32;
      --warning: #ef6c00;
      --danger: #c62828;
      --shadow: 0 24px 56px rgba(27,19,13,0.12);
      --shadow-deep: 0 30px 70px rgba(18,12,7,0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle at top, rgba(240,179,93,0.2), transparent 30%), linear-gradient(180deg, #f9f4ee 0%, #f3e7d8 100%);
      color: var(--text);
      padding: 32px 18px;
    }

    .track-shell {
      max-width: 980px;
      margin: 0 auto;
    }

    .track-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(255,249,241,0.88));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow-deep);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .track-card::before {
      content: '';
      position: absolute;
      inset: -80px auto auto -80px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(240,179,93,0.2), transparent 68%);
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 14px 26px rgba(123, 77, 23, 0.18);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 36px);
      background: linear-gradient(135deg, var(--gold-strong), var(--gold-dark), #f9d18d);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .back-link {
      color: var(--gold-dark);
      text-decoration: none;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(240,179,93,0.1);
      border: 1px solid rgba(137,94,40,0.12);
    }

    .track-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,248,239,0.72));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      padding: 9px 14px;
      border-radius: 999px;
      color: #fff;
      font-weight: 800;
      box-shadow: 0 12px 20px rgba(0,0,0,0.1);
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    }

    .status-badge.pending { background: linear-gradient(135deg, var(--warning), #d96800); }
    .status-badge.done { background: linear-gradient(135deg, #47b85d, var(--success)); }
    .status-badge.cancel { background: linear-gradient(135deg, #da6f63, var(--danger)); }

    .detail-list {
      display: grid;
      gap: 12px;
    }

    .detail-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(137,94,40,0.08);
      border-radius: 12px;
      background: rgba(255,255,255,0.56);
    }

    .detail-item span {
      color: var(--muted);
      font-weight: 700;
    }

    .detail-item strong {
      max-width: 60%;
      text-align: left;
      color: var(--text);
      word-break: break-word;
    }

    .search-panel {
      display: grid;
      gap: 12px;
    }

    .search-panel input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 13px 14px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    .search-panel input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(240,179,93,0.15);
      border-color: rgba(137,94,40,0.25);
    }

    .search-panel button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      box-shadow: 0 16px 24px rgba(123,77,23,0.18);
    }

    .lookup-message {
      min-height: 20px;
      margin: 0;
      font-weight: 700;
    }

    .lookup-message.error { color: var(--danger); }
    .lookup-message.success { color: var(--success); }

    .item-list {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(137,94,40,0.08);
      background: rgba(255,255,255,0.52);
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .track-grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .detail-item { flex-direction: column; align-items: flex-start; }
      .detail-item strong { max-width: 100%; text-align: right; }
    }
  </style>
</head>
<body>
  <div class="track-shell">
    <div class="track-card">
      <div class="topbar">
        <div class="brand">
          <img src="logo/logo.jpeg" alt="Cairo22" />
          <h1>تتبع الطلب</h1>
        </div>
        <a href="index.html" class="back-link">العودة للمتجر</a>
      </div>

      <div class="track-grid">
        <section class="panel">
          <div class="status-row">
            <h2 style="margin:0;">تفاصيل الطلب</h2>
            <span id="statusBadge" class="status-badge">جديد</span>
          </div>

          <div class="detail-list">
            <div class="detail-item"><span>مرجع الطلب</span><strong id="orderRef">—</strong></div>
            <div class="detail-item"><span>اسم العميل</span><strong id="name">—</strong></div>
            <div class="detail-item"><span>رقم الهاتف</span><strong id="phone">—</strong></div>
            <div class="detail-item"><span>العنوان</span><strong id="address">—</strong></div>
            <div class="detail-item"><span>طريقة الدفع</span><strong id="paymentMethod">—</strong></div>
            <div class="detail-item"><span>تفاصيل الدفع</span><strong id="paymentDetails">—</strong></div>
            <div class="detail-item"><span>الإجمالي</span><strong id="total">0 EGP</strong></div>
          </div>

          <div class="detail-item" style="margin-top:14px;">
            <span>المنتجات</span>
            <strong id="itemsText">—</strong>
          </div>
        </section>

        <aside class="panel search-panel">
          <h2 style="margin:0;">البحث عن الطلب</h2>
          <input id="trackInput" type="text" placeholder="أدخل رقم الهاتف أو مرجع الطلب" />
          <button type="button" onclick="lookUpOrder()">بحث</button>
          <p id="lookupMessage" class="lookup-message"></p>
        </aside>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    function getStatusClass(status) {
      const value = String(status || 'جديد').trim();
      if (value === 'مكتمل') return 'done';
      if (value === 'ملغي') return 'cancel';
      return 'pending';
    }

    function formatItems(items) {
      if (!Array.isArray(items) || !items.length) return '—';
      return items.map(item => `${item.name || 'منتج'} × ${item.qty || 1}`).join(' | ');
    }

    function fillData(order) {
      const statusValue = order.status || 'جديد';
      const badge = document.getElementById('statusBadge');
      if (badge) {
        badge.textContent = statusValue;
        badge.className = `status-badge ${getStatusClass(statusValue)}`;
      }

      const paymentMethod = order.paymentMethod || order.paymentDetails?.method || 'cash';
      const walletType = order.paymentDetails?.walletType || '';
      const paymentPhone = order.paymentDetails?.phone || '';
      const paymentReference = order.paymentDetails?.reference || '';
      const paymentLabel = paymentMethod === 'instapay' ? 'Instapay' : paymentMethod === 'wallet' ? 'محفظة إلكترونية' : 'الدفع عند الاستلام';
      const detailsText = [walletType, paymentPhone, paymentReference].filter(Boolean).join(' • ') || '—';

      document.getElementById('orderRef').textContent = order.orderRef || '—';
      document.getElementById('name').textContent = order.name || '—';
      document.getElementById('phone').textContent = order.phone || '—';
      document.getElementById('address').textContent = order.address || '—';
      document.getElementById('paymentMethod').textContent = paymentLabel;
      document.getElementById('paymentDetails').textContent = detailsText;
      document.getElementById('total').textContent = `${Number(order.finalTotal || order.total || 0).toLocaleString()} EGP`;
      document.getElementById('itemsText').textContent = formatItems(order.items || []);
    }

    function findOrderByValue(value) {
      const orders = JSON.parse(localStorage.getItem('cairo22_orders') || '[]');
      return orders.find((order) => {
        const query = String(value || '').trim().toLowerCase();
        if (!query) return false;
        const orderRef = String(order.orderRef || '').toLowerCase();
        const phone = String(order.phone || '').toLowerCase();
        return phone.includes(query) || orderRef.includes(query);
      }) || null;
    }

    const initialOrder = {
      orderRef: params.get('orderRef') || '—',
      name: params.get('name') || '—',
      phone: params.get('phone') || '—',
      address: params.get('address') || '—',
      status: params.get('status') || 'جديد',
      finalTotal: params.get('total') || 0,
      paymentMethod: params.get('paymentMethod') || 'cash',
      paymentDetails: {
        walletType: params.get('walletType') || '',
        phone: params.get('paymentPhone') || '',
        reference: params.get('paymentReference') || ''
      },
      items: []
    };

    const storedMatch = initialOrder.orderRef && initialOrder.orderRef !== '—' ? findOrderByValue(initialOrder.orderRef) : null;
    fillData(storedMatch || initialOrder);

    window.lookUpOrder = function lookUpOrder() {
      const value = document.getElementById('trackInput').value.trim();
      const message = document.getElementById('lookupMessage');
      const found = findOrderByValue(value);

      if (!found) {
        message.textContent = 'لم يتم العثور على طلب بهذا الرقم أو المرجع.';
        message.className = 'lookup-message error';
        return;
      }

      fillData(found);
      message.textContent = 'تم العثور على الطلب بنجاح.';
      message.className = 'lookup-message success';
    };
  </script>
</body>
</html>
