<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إتمام الشراء | Cairo22</title>
  <link rel="stylesheet" href="../css/checkout.css" />
  <link rel="shortcut icon" href="../../logo/logo.jpeg" type="image/x-icon" />
</head>
<body>
  <div class="box">
    <h2>🧾 إتمام الطلب</h2>
    <input type="text" id="name" placeholder="الاسم" />
    <input type="text" id="phone" placeholder="رقم الموبايل" />
    <input type="email" id="email" placeholder="البريد الإلكتروني (اختياري)" />
    <input type="text" id="address" placeholder="العنوان" />
    <input type="text" id="orderRef" placeholder="مرجع الطلب (اختياري)" />

    <div class="summary">
      <h3>ملخص الطلب</h3>
      <div id="orderItems"></div>
      <hr />
      <p id="totals"></p>
    </div>

    <p id="orderStatus" style="color:#2e7d32;font-weight:700;margin-top:10px;"></p>
    <button onclick="submitOrder()">تأكيد الطلب</button>
  </div>

  <script type="module" src="../java script/checkout.js"></script>
  <script src="../java script/site-ui.js"></script>
</body>
</html>
